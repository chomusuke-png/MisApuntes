[package]
name = "wordbridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "ffb155a0321bba08da495efda66495104c1c8b9a" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "ffb155a0321bba08da495efda66495104c1c8b9a" }
wordcraft-docbin = { git = "https://github.com/storytold/wordcraft", rev = "ffb155a0321bba08da495efda66495104c1c8b9a" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
